
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RELAÇÕES</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080808;color:#eee;
 font-family:Arial,sans-serif;letter-spacing:1px;
}
main{max-width:850px;margin:auto;padding:25px 18px}
header{border-bottom:1px solid #333;padding-bottom:18px}
h1{font-weight:300;letter-spacing:9px;font-size:38px}
small,.muted{color:#777;font-size:10px;letter-spacing:2px}
hr{border:0;border-top:1px solid #292929;margin:25px 0}
input,select,button{
 background:#090909;color:#eee;border:1px solid #444;
 padding:12px;font-size:12px;letter-spacing:1px;
}
button{cursor:pointer}
button:hover{border-color:#eee}
select,input{width:100%}
label{display:block;color:#888;font-size:10px;margin:15px 0 7px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.person{
 display:flex;align-items:center;gap:13px;
 border:1px solid #292929;padding:12px;min-height:105px;
}
.person.self{opacity:.3;pointer-events:none}
.portrait{
 width:65px;height:75px;border:1px solid #555;
 display:grid;place-items:center;color:#777;font-size:9px;
 flex-shrink:0;
}
.name{font-size:12px;margin-bottom:12px}
.dots{display:flex;gap:9px}
.dot{
 width:17px;height:17px;border-radius:50%;
 border:1px solid #eee;padding:0;
}
.dot.active{background:#eee}
.dot.red{border-color:#b33}
.dot.red.active{background:#d22;border-color:#f66}
.hate-label{color:#c44;font-size:9px;margin-top:8px}
.panel{border:1px solid #333;padding:20px}
.hidden{display:none!important}
.modal{
 position:fixed;inset:0;background:#000e;
 display:grid;place-items:center;padding:20px;
}
.modalbox{background:#111;border:1px solid #555;padding:24px;width:100%;max-width:400px}
.entry{border-top:1px solid #333;padding:12px 0;font-size:11px;color:#aaa}
@media(max-width:550px){.grid{grid-template-columns:1fr}h1{font-size:30px}}
</style>
</head>
<body>
<main>
<header>
 <div class="row between">
  <small>R / DATABASE</small>
  <small id="soundStatus">SOM DESLIGADO</small>
 </div>
 <h1>RELAÇÕES</h1>
 <small>REGISTRO DE VÍNCULOS · ACESSO RESTRITO</small>
</header>

<hr>

<section id="login" class="panel">
 <label>JOGADOR</label>
 <select id="player">
  <option value="">Selecione</option>
  <option>Lorena</option>
  <option>Louanne</option>
  <option>Aida</option>
  <option>Napo</option>
  <option>VH</option>
  <option>Maya</option>
  <option>Mestre</option>
 </select>

 <div id="charBox" class="hidden">
  <label>PERSONAGEM</label>
  <select id="character"></select>
 </div>

 <div id="passBox" class="hidden">
  <label>SENHA DO MESTRE</label>
  <input id="password" type="password">
 </div>

 <br><br>
 <button id="loginBtn">ACESSAR ↗</button>
</section>

<section id="application" class="hidden">
 <div class="row between">
  <div>
   <small>PERSONAGEM ATIVO</small>
   <h3 id="activeName"></h3>
  </div>
  <div class="row">
   <button id="audioBtn">SOM OFF</button>
   <button id="exitBtn">SAIR</button>
  </div>
 </div>
 <hr>

 <section id="playerArea">
  <div class="row between">
   <small>RELAÇÕES</small>
   <button id="hateBtn">✳ REGISTRAR ÓDIO</button>
  </div>
  <br>
  <div id="people" class="grid"></div>
 </section>

 <section id="masterArea" class="hidden">
  <small>CONTROLE DO MESTRE</small>
  <label>PERSONAGEM</label>
  <select id="masterSelect"></select>
  <br><br>
  <div id="masterPeople" class="grid"></div>
  <hr>
  <small>HISTÓRICO</small>
  <div id="history"></div>
 </section>
</section>

<div id="modal" class="modal hidden">
 <div class="modalbox">
  <small>REGISTRO EXTRAORDINÁRIO</small>
  <h2 style="font-weight:300">PONTOS DE ÓDIO</h2>
  <p>Você tem certeza de que deseja registrar ódio?</p>
  <label>PERSONAGEM</label>
  <select id="hateTarget"></select>
  <label>QUANTIDADE DE PONTOS</label>
  <div id="hateDots" class="dots"></div>
  <br><br>
  <div class="row">
   <button id="confirmHate">CONFIRMAR</button>
   <button id="cancelHate">CANCELAR</button>
  </div>
 </div>
</div>
</main>

<script>
const roster={
 Lorena:["Sol","Arman"],
 Louanne:["Cristina"],
 Aida:["Isis"],
 Napo:["Ykaro"],
 VH:["Virgulino"],
 Maya:["Morgana"],
 Mestre:["Lisandre","Kalel"]
};

const npcs=["Lisandre","Kalel"];
const allCharacters=[
 ...Object.values(roster).filter((v)=>v!==roster.Mestre).flat(),
 ...npcs
];

let current="";
let master=false;
let hateValue=0;
let soundOn=false;
let audioContext=null;
let ambientNodes=[];

let data=JSON.parse(localStorage.getItem("relacoes_data")||
 '{"relations":{},"history":[]}');

function save(){
 localStorage.setItem("relacoes_data",JSON.stringify(data));
}

function getRelation(a,b){
 return data.relations[a+"|"+b]||{trust:0,hate:0};
}

function record(a,b,type,value){
 data.history.unshift({
  date:new Date().toLocaleString("pt-BR"),
  actor:a,target:b,type,value
 });
 save();
}

const $=id=>document.getElementById(id);

$("player").onchange=()=>{
 let p=$("player").value;
 $("charBox").classList.toggle("hidden",!p||p==="Mestre");
 $("passBox").classList.toggle("hidden",p!=="Mestre");
 $("character").innerHTML="";
 (roster[p]||[]).forEach(c=>{
  $("character").add(new Option(c,c));
 });
};

$("loginBtn").onclick=()=>{
 let p=$("player").value;
 if(!p)return alert("Selecione um jogador.");

 master=p==="Mestre";

 if(master&&$("password").value!=="relacoes")
  return alert("Senha incorreta.");

 current=master?"Lisandre":$("character").value;

 $("login").classList.add("hidden");
 $("application").classList.remove("hidden");
 $("playerArea").classList.toggle("hidden",master);
 $("masterArea").classList.toggle("hidden",!master);
 $("activeName").textContent=master?"MESTRE":current;

 if(master)renderMaster();
 else renderPlayer();
};

$("exitBtn").onclick=()=>{
 $("application").classList.add("hidden");
 $("login").classList.remove("hidden");
 $("password").value="";
};

function createDots(parent,value,max,color,callback){
 parent.innerHTML="";
 for(let i=1;i<=max;i++){
  let b=document.createElement("button");
  b.className="dot "+(color==="red"?"red":"")+(i<=value?" active":"");
  b.onclick=()=>callback(i);
  parent.append(b);
 }
}

function renderPlayer(){
 $("people").innerHTML="";

 allCharacters.filter(c=>c!==current).forEach(name=>{
  let r=getRelation(current,name);
  let card=document.createElement("div");
  card.className="person";

  card.innerHTML=`
   <div class="portrait">RETRATO</div>
   <div style="flex:1">
    <div class="name">${name.toUpperCase()}</div>
    <div class="dots trust"></div>
    <div class="hate-label ${r.hate?"":"hidden"}">ÓDIO</div>
    <div class="dots hate"></div>
   </div>`;

  createDots(card.querySelector(".trust"),r.trust,3,"white",n=>{
   r.trust=n===r.trust?n-1:n;
   data.relations[current+"|"+name]=r;
   record(current,name,"Relação",r.trust);
   playClick();
   renderPlayer();
  });

  createDots(card.querySelector(".hate"),r.hate,3,"red",()=>{});
  card.querySelector(".hate").classList.toggle("hidden",!r.hate);
  $("people").append(card);
 });
}

$("hateBtn").onclick=()=>{
 $("hateTarget").innerHTML="";
 allCharacters.filter(c=>c!==current).forEach(c=>{
  $("hateTarget").add(new Option(c,c));
 });
 hateValue=0;
 createDots($("hateDots"),0,3,"red",n=>{
  hateValue=n===hateValue?0:n;
  createDots($("hateDots"),hateValue,3,"red",arguments[0]);
 });
 $("modal").classList.remove("hidden");
 playMetal();
};

$("cancelHate").onclick=()=>$("modal").classList.add("hidden");

$("confirmHate").onclick=()=>{
 let target=$("hateTarget").value;
 if(!target)return;
 let r=getRelation(current,target);
 r.hate=hateValue;
 data.relations[current+"|"+target]=r;
 record(current,target,"Ódio",hateValue);
 save();
 $("modal").classList.add("hidden");
 renderPlayer();
 playMetal();
};

$("masterSelect").onchange=renderMaster;

function renderMaster(){
 let select=$("masterSelect");
 if(!select.options.length){
  [...allCharacters].forEach(c=>select.add(new Option(c,c)));
 }
 let who=select.value||"Lisandre";
 $("activeName").textContent=who;
 $("masterPeople").innerHTML="";

 allCharacters.filter(c=>c!==who).forEach(name=>{
  let r=getRelation(who,name);
  let card=document.createElement("div");
  card.className="person";
  card.innerHTML=`
   <div class="portrait">RETRATO</div>
   <div>
    <div class="name">${name.toUpperCase()}</div>
    <div class="dots"></div>
    <div class="hate-label">ÓDIO: ${r.hate}</div>
   </div>`;
  createDots(card.querySelector(".dots"),r.trust,3,"white",()=>{});
  $("masterPeople").append(card);
 });

 $("history").innerHTML=data.history.map(h=>
  `<div class="entry">${h.date} · ${h.actor} → ${h.target} · ${h.type}: ${h.value}</div>`
 ).join("")||"Nenhuma alteração registrada.";
}

// ÁUDIO
function audio(){
 if(!audioContext)
  audioContext=new(window.AudioContext||window.webkitAudioContext)();
 if(audioContext.state==="suspended")audioContext.resume();
 return audioContext;
}

function tone(freq,duration,type,volume){
 if(!soundOn)return;
 let ctx=audio(),osc=ctx.createOscillator(),gain=ctx.createGain();
 osc.type=type;
 osc.frequency.value=freq;
 gain.gain.setValueAtTime(volume,ctx.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);
 osc.connect(gain);
 gain.connect(ctx.destination);
 osc.start();
 osc.stop(ctx.currentTime+duration);
}

function playClick(){
 tone(680,.08,"sine",.025);
 setTimeout(()=>tone(920,.05,"sine",.015),40);
}

function playMetal(){
 tone(155,.32,"sawtooth",.04);
 setTimeout(()=>tone(310,.28,"triangle",.035),65);
 setTimeout(()=>tone(470,.2,"triangle",.02),110);
}

function startAmbient(){
 let ctx=audio();
 [55,82.4].forEach(freq=>{
  let osc=ctx.createOscillator();
  let gain=ctx.createGain();
  osc.type="sine";
  osc.frequency.value=freq;
  gain.gain.value=.003;
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start();
  ambientNodes.push({osc,gain});
 });
}

function stopAmbient(){
 ambientNodes.forEach(n=>{
  n.osc.stop();
  n.gain.disconnect();
 });
 ambientNodes=[];
}

$("audioBtn").onclick=()=>{
 soundOn=!soundOn;
 $("audioBtn").textContent=soundOn?"SOM ON":"SOM OFF";
 $("soundStatus").textContent=soundOn?"SOM ATIVO":"SOM DESLIGADO";
 if(soundOn){
  audio();
  startAmbient();
  playClick();
 }else stopAmbient();
};
</script>
</body>
</html>
